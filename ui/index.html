<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>SlothBank</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5ef;
    --surface: #ffffff;
    --surface-soft: #eef2e9;
    --text: #252c25;
    --muted: #697469;
    --line: #dfe5d9;
    --accent: #527747;
    --accent-strong: #365a30;
    --accent-soft: #e5eddf;
    --warn: #b45309;
    --warn-bg: #fff0dc;
    --band: #c9ddbd;
    --shadow: 0 8px 28px rgba(40, 55, 37, .055);
    --radius: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #151a17;
      --surface: #202722;
      --surface-soft: #29332b;
      --text: #edf2eb;
      --muted: #a4b0a3;
      --line: #39453b;
      --accent: #a5c995;
      --accent-strong: #c2dfb3;
      --accent-soft: #2d3d2c;
      --warn: #ffb36b;
      --warn-bg: #402d1d;
      --band: #465e40;
      --shadow: 0 8px 28px rgba(0, 0, 0, .16);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151a17;
    --surface: #202722;
    --surface-soft: #29332b;
    --text: #edf2eb;
    --muted: #a4b0a3;
    --line: #39453b;
    --accent: #a5c995;
    --accent-strong: #c2dfb3;
    --accent-soft: #2d3d2c;
    --warn: #ffb36b;
    --warn-bg: #402d1d;
    --band: #465e40;
    --shadow: 0 8px 28px rgba(0, 0, 0, .16);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(ellipse at 10% 0%, var(--accent-soft), transparent 38%),
      var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(1440px, 100%);
    margin: 0 auto;
    padding: 36px 28px 56px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.65rem, 3vw, 2.15rem);
    font-weight: 750;
    letter-spacing: -.045em;
    line-height: 1.2;
  }

  h2 {
    margin: 30px 0 14px;
    font-size: 1.05rem;
    font-weight: 750;
    letter-spacing: -.015em;
  }

  h3 {
    line-height: 1.4;
  }

  p {
    margin-top: 0;
  }

  .sub {
    color: var(--muted);
    font-size: .82rem;
  }

  header .sub {
    margin-top: 7px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    font-weight: 600;
  }

  button {
    min-height: 40px;
    padding: 9px 15px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: .88rem;
    font-weight: 650;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease,
      transform .18s ease;
  }

  button:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  button:active:not(:disabled) {
    transform: translateY(1px);
  }

  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  button:disabled {
    opacity: .65;
    cursor: not-allowed;
  }

  #run:disabled {
    background: var(--surface-soft);
  }

  #msg {
    margin: 8px 0;
  }

  #content {
    min-width: 0;
  }

  .card {
    min-width: 0;
    margin-bottom: 16px;
    padding: 21px;
    overflow-wrap: anywhere;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .summary {
    padding: 24px 26px;
    border-color: var(--line);
    background: linear-gradient(125deg, var(--surface), var(--surface-soft));
    font-size: clamp(1rem, 1.8vw, 1.12rem);
    line-height: 1.75;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: stretch;
  }

  .grid > .card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 172px;
    margin: 0;
    transition: border-color .18s ease, transform .18s ease,
      box-shadow .18s ease;
  }

  .grid > .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .m-name {
    margin-bottom: 7px;
    font-size: .98rem;
    font-weight: 750;
    letter-spacing: -.015em;
  }

  .m-fc {
    margin-bottom: 14px;
    color: var(--muted);
    font-size: .84rem;
    line-height: 1.7;
    font-variant-numeric: tabular-nums;
  }

  .anom {
    border-color: var(--warn);
    background: linear-gradient(145deg, var(--surface), var(--warn-bg));
  }

  .anom h3 {
    margin: 0 0 12px;
    font-size: 1.05rem;
    font-weight: 750;
  }

  .anom-labels {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 12px;
  }

  .anom-labels .chip {
    margin-right: 0;
  }

  .anom-metric {
    margin-bottom: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--warn-bg);
    color: var(--warn);
    font-size: .75rem;
    font-weight: 700;
  }

  table {
    width: 100%;
    margin: 16px 0;
    border-collapse: collapse;
    font-size: .88rem;
  }

  td, th {
    padding: 10px 9px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }

  th {
    color: var(--muted);
    font-size: .78rem;
    font-weight: 700;
  }

  td.n, th.n {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .email-subject {
    margin: 14px 0 8px;
    font-weight: 750;
  }

  .email-body {
    margin: 8px 0 12px;
    padding: 16px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    font: .85rem/1.75 ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  pre {
    max-width: 100%;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .foot {
    margin-top: 22px;
    color: var(--muted);
    font-size: .8rem;
    line-height: 1.7;
  }

  .err {
    padding: 12px 14px;
    border: 1px solid var(--warn);
    border-radius: 12px;
    background: var(--warn-bg);
    color: var(--warn);
  }

  @media (min-width: 900px) {
    #content > .anom {
      padding: 25px;
    }
  }

  @media (max-width: 760px) {
    main {
      padding: 25px 18px 40px;
    }

    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      padding: 17px;
      border-radius: 15px;
    }

    .summary {
      padding: 20px;
    }
  }

  @media (max-width: 480px) {
    main {
      padding: 20px 13px 32px;
    }

    header {
      align-items: flex-start;
      gap: 12px;
    }

    h1 {
      font-size: 1.55rem;
    }

    h2 {
      margin-top: 25px;
    }

    .grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .grid > .card {
      min-height: 145px;
    }

    .card {
      padding: 15px;
    }

    .summary {
      padding: 17px;
      font-size: .98rem;
    }

    table {
      font-size: .78rem;
    }

    td, th {
      padding: 8px 5px;
    }

    .email-body {
      padding: 12px;
      font-size: .78rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
  .overview-charts { margin: 22px 0; min-width: 0; }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }
  .chart-card { min-width: 0; overflow: hidden; }
  .chart-card h3 { margin: 0 0 5px; font-size: 1rem; }
  .chart-card > .sub { margin: 0 0 12px; }
  .chart-card svg { max-width: 100%; overflow: visible; }
  @media (max-width: 760px) {
    .overview-grid { grid-template-columns: minmax(0, 1fr); }
  }
  .header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }

  .theme-control {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: .9rem;
  }

  .theme-control select {
    max-width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
  }

  .theme-control select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .header-actions {
      width: 100%;
      justify-content: space-between;
    }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🦥 SlothBank</h1>
      <div class="sub" id="meta">loading…</div>
    </div>
    <div class="header-actions">
      <label class="theme-control" for="theme-select">
        <span>Theme</span>
        <select id="theme-select" aria-label="Choose color theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <button id="run">Wake the sloth</button>
    </div>
  </header>

  <div id="msg" class="sub"></div>
  <div id="content"></div>
  <p class="foot">Everything on this page was computed on this machine. Sample data is synthetic unless you dropped in your own bills.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  for (const k of kids) e.append(k);
  return e;
}
function svg(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const money = (cur, n) => (n < 0 ? "-" : "") + cur + Math.abs(n).toFixed(2);

function sparkline(m) {
  const W = 240, H = 64, P = 8;
  const vals = m.series.map((s) => s.value);
  const f = m.forecast;
  const all = vals.concat(f ? [f.p10, f.p90] : []);
  const lo = Math.min(...all), hi = Math.max(...all);
  const span = hi - lo || 1;
  const n = vals.length + (f ? 1 : 0);
  const x = (i) => P + (i * (W - 2 * P)) / Math.max(n - 1, 1);
  const y = (v) => H - P - ((v - lo) / span) * (H - 2 * P);
  const flagged = new Set(m.checks.filter((c) => c.flagged).map((c) => c.source_file));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${m.merchant} spending history and forecast` });
  s.append(svg("polyline", { points: vals.map((v, i) => `${x(i)},${y(v)}`).join(" "), fill: "none", stroke: "var(--muted)", "stroke-width": 2 }));
  m.series.forEach((p, i) => s.append(svg("circle", { cx: x(i), cy: y(p.value), r: flagged.has(p.source_file) ? 4.5 : 2.5, fill: flagged.has(p.source_file) ? "var(--warn)" : "var(--muted)" })));
  if (f) {
    const fx = x(n - 1);
    s.append(svg("line", { x1: x(vals.length - 1), y1: y(vals[vals.length - 1]), x2: fx, y2: y(f.median), stroke: "var(--accent)", "stroke-dasharray": "3 3" }));
    s.append(svg("rect", { x: fx - 4, y: y(f.p90), width: 8, height: Math.max(y(f.p10) - y(f.p90), 1), fill: "var(--band)", rx: 3 }));
    s.append(svg("circle", { cx: fx, cy: y(f.median), r: 3.5, fill: "var(--accent)" }));
  }
  return s;
}

function renderOverviewCharts(d) {
  const c = d.currency;
  const panel = el("section", { className: "overview-charts" });
  const grid = el("div", { className: "overview-grid" });

  const makeCard = (title, note) => {
    const card = el("div", { className: "card chart-card" });
    card.append(
      el("h3", { textContent: title }),
      el("p", { className: "sub", textContent: note })
    );
    return card;
  };

  const makeSvg = (label, height = 220) => {
    const s = svg("svg", {
      viewBox: `0 0 520 ${height}`,
      role: "img",
      "aria-label": label,
      preserveAspectRatio: "xMidYMid meet"
    });
    s.style.width = "100%";
    s.style.height = "auto";
    return s;
  };

  const text = (s, x, y, value, anchor = "start") => {
    const t = svg("text", {
      x, y, "text-anchor": anchor,
      fill: "var(--text)",
      "font-size": 12
    });
    t.textContent = value;
    s.append(t);
  };

  // 1. Historical monthly spending, aggregated from dated bills.
  {
    const card = makeCard(
      "Spending over time",
      "Recorded bills grouped by billing month"
    );
    const totals = new Map();

    for (const m of d.merchants) {
      for (const p of (m.series || [])) {
        const month = String(p.date).slice(0, 7);
        if (!month || month === "undefined") continue;
        totals.set(month, (totals.get(month) || 0) + Number(p.value || 0));
      }
    }

    const points = [...totals.entries()].sort((a, b) =>
      a[0].localeCompare(b[0])
    );

    if (points.length >= 2) {
      const s = makeSvg("Monthly total of recorded bills");
      const values = points.map(p => p[1]);
      const lo = Math.min(0, ...values);
      const hi = Math.max(...values) || 1;
      const x = i => 48 + i * (440 / Math.max(points.length - 1, 1));
      const y = v => 170 - ((v - lo) / (hi - lo || 1)) * 125;

      s.append(svg("line", {
        x1: 42, y1: 170, x2: 490, y2: 170,
        stroke: "var(--line)"
      }));
      s.append(svg("polyline", {
        points: points.map((p, i) => `${x(i)},${y(p[1])}`).join(" "),
        fill: "none", stroke: "var(--accent)",
        "stroke-width": 3, "stroke-linejoin": "round",
        "stroke-linecap": "round"
      }));

      points.forEach((p, i) => {
        s.append(svg("circle", {
          cx: x(i), cy: y(p[1]), r: 4,
          fill: "var(--accent)"
        }));
        text(s, x(i), 193, p[0].slice(5), "middle");
      });

      text(s, 42, 25, money(c, hi));
      text(s, 42, 42, "Monthly total");
      card.append(s);
    } else {
      card.append(el("p", {
        className: "sub",
        textContent: "Not enough dated history to draw a trend yet."
      }));
    }
    grid.append(card);
  }

  // 2. Compare available forecast medians by merchant.
  {
    const card = makeCard(
      "Forecast by merchant",
      "Median estimates for next month"
    );
    const merchants = d.merchants.filter(m =>
      m.forecast && Number.isFinite(Number(m.forecast.median))
    );
    const s = makeSvg("Next-month forecast comparison",
      Math.max(180, merchants.length * 42 + 35)
    );

    if (merchants.length) {
      const max = Math.max(...merchants.map(m =>
        Number(m.forecast.median)
      )) || 1;

      merchants.forEach((m, i) => {
        const y = 22 + i * 42;
        const value = Number(m.forecast.median);
        const label = m.merchant.length > 22
          ? m.merchant.slice(0, 20) + "…"
          : m.merchant;

        text(s, 8, y + 13, label);
        s.append(svg("rect", {
          x: 190, y, width: 260 * value / max, height: 20,
          rx: 5, fill: "var(--accent)", opacity: 0.85
        }));
        text(s, 510, y + 14, money(c, value), "end");
      });
    } else {
      text(s, 12, 40, "No forecasts available");
    }

    card.append(s);
    if (merchants.length < d.merchants.length) {
      card.append(el("p", {
        className: "sub",
        textContent: "Some merchants are excluded because they lack a forecast."
      }));
    }
    grid.append(card);
  }

  // 3. Share of the available forecast total by merchant.
  {
    const card = makeCard(
      "Forecast composition",
      "Share of available merchant forecasts, not expense categories"
    );
    const merchants = d.merchants.filter(m =>
      m.forecast && Number.isFinite(Number(m.forecast.median)) &&
      Number(m.forecast.median) >= 0
    );
    const total = merchants.reduce((sum, m) =>
      sum + Number(m.forecast.median), 0
    );

    if (total > 0) {
      const s = makeSvg("Donut chart of available merchant forecast shares", 250);
      const cx = 145, cy = 118, r = 75;
      const colors = [
        "var(--accent)", "#86a9a0", "#d6a85f",
        "#8f91bd", "#c27b5c", "#7896bd"
      ];
      let angle = -Math.PI / 2;

      merchants.forEach((m, i) => {
        const fraction = Number(m.forecast.median) / total;
        const next = angle + fraction * Math.PI * 2;
        const x1 = cx + r * Math.cos(angle);
        const y1 = cy + r * Math.sin(angle);
        const x2 = cx + r * Math.cos(next);
        const y2 = cy + r * Math.sin(next);
        const large = fraction > 0.5 ? 1 : 0;

        s.append(svg("path", {
          d: `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`,
          fill: colors[i % colors.length],
          stroke: "var(--card)",
          "stroke-width": 2
        }));
        angle = next;
      });

      s.append(svg("circle", {
        cx, cy, r: 43, fill: "var(--surface)"
      }));
      text(s, cx, cy - 2, money(c, d.next_month_total ?? total), "middle");
      text(s, cx, cy + 16, "forecast", "middle");

      merchants.forEach((m, i) => {
        const y = 25 + i * 38;
        s.append(svg("circle", {
          cx: 290, cy: y - 4, r: 5,
          fill: colors[i % colors.length]
        }));
        const name = m.merchant.length > 20
          ? m.merchant.slice(0, 18) + "…"
          : m.merchant;
        text(s, 302, y, name);
        text(s, 510, y, `${(Number(m.forecast.median) / total * 100).toFixed(1)}%`, "end");
      });
      card.append(s);
    } else {
      card.append(el("p", {
        className: "sub",
        textContent: "No forecast values available for comparison."
      }));
    }
    grid.append(card);
  }

  panel.append(grid);
  return panel;
}
function render(d) {
  const c = d.currency;
  $("meta").replaceChildren(
    `Data through ${d.as_of} · generated ${new Date(d.generated_at).toLocaleString()} `,
    el("span", { className: "badge", textContent: `${d.engine} · local` }),
  );
  const root = $("content");
  root.replaceChildren(el("div", { className: "card summary", textContent: d.sloth_summary }));

  if (d.anomalies.length) {
    root.append(el("h2", { textContent: "Needs your attention" }));
    for (const a of d.anomalies) {
      const card = el("div", { className: "card anom" });
      card.append(el("h3", { textContent: `${a.merchant} · ${a.billing_date}` }));
      card.append(
        el("div", { className: "anom-labels" },
          el("span", { className: "chip", textContent: a.analysis.likely_cause.replace("_", " ") }),
          el("span", { className: "chip", textContent: `suggest: ${a.analysis.recommended_action}` }),
        ),
        el("div", {
          className: "anom-metric",
          textContent: `${money(c, a.actual)} billed vs ${money(c, a.expected)} expected (${a.deviation_pct > 0 ? "+" : ""}${a.deviation_pct}%, 90% range ${money(c, a.p05)}–${money(c, a.p95)})`,
        }),
      );
      card.append(el("p", { textContent: a.analysis.explanation + (a.analysis.from_model ? "" : " (model unavailable, showing computed fallback)") }));
      if (a.diff.length) {
        const t = el("table");
        t.append(el("tr", {}, el("th", { textContent: "Line item" }), el("th", { className: "n", textContent: "Before" }), el("th", { className: "n", textContent: "Now" }), el("th", { className: "n", textContent: "Change" })));
        for (const r of a.diff)
          t.append(el("tr", {}, el("td", { textContent: r.description }), el("td", { className: "n", textContent: r.prev === null ? "new" : money(c, r.prev) }), el("td", { className: "n", textContent: r.cur === null ? "removed" : money(c, r.cur) }), el("td", { className: "n", textContent: (r.delta > 0 ? "+" : "") + money(c, r.delta) })));
        card.append(t);
      }
      if (a.email) {
        card.append(el("div", { className: "sub", textContent: "Draft email (not sent)" }));
        const text = `Subject: ${a.email.subject}\n\n${a.email.body}`;
        card.append(
          el("div", { className: "email-subject", textContent: `Subject: ${a.email.subject}` }),
          el("pre", { className: "email-body", textContent: a.email.body }),
        );
        const b = el("button", { textContent: "Copy email" });
        b.onclick = async () => { await navigator.clipboard.writeText(text); b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy email"), 1500); };
        card.append(b);
      }
      root.append(card);
    }
  }

  const forecastSection = el("section", { className: "forecast-section" });
  forecastSection.append(el("h2", { textContent: d.next_month_total === null ? "Monthly forecast" : `Monthly forecast · ${money(c, d.next_month_total)} total` }));
  const grid = el("div", { className: "grid" });
  for (const m of d.merchants) {
    const card = el("div", { className: "card" });
    card.append(el("div", { className: "m-name", textContent: m.merchant }));
    card.append(el("div", { className: "m-fc", textContent: m.forecast ? `${m.forecast.month}: ${money(c, m.forecast.median)} (${money(c, m.forecast.p10)}–${money(c, m.forecast.p90)})` : `needs more history (${m.n} bills)` }));
    card.append(sparkline(m));
    grid.append(card);
  }
  forecastSection.append(grid);

  // Keep the summary first, followed by charts and forecasts.
  const overview = renderOverviewCharts(d);
  root.insertBefore(overview, root.children[1]);
  root.insertBefore(forecastSection, overview.nextSibling);

  const b = d.backtest;
  if (b.n) root.append(el("p", { className: "foot", textContent: `Backtest on ${b.n} past bills: ${d.engine} median error ${money(c, b.engine_mae)} vs ${money(c, b.naive_last_mae)} for "same as last month".` }));
}

const themeSelect = $("theme-select");

function applyTheme(theme) {
  if (theme === "light" || theme === "dark") {
    document.documentElement.dataset.theme = theme;
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}

function loadThemePreference() {
  let saved = "system";
  try {
    const stored = localStorage.getItem("slothbank-theme");
    if (["system", "light", "dark"].includes(stored)) saved = stored;
  } catch {}

  themeSelect.value = saved;
  applyTheme(saved);
}

themeSelect.addEventListener("change", () => {
  const selected = themeSelect.value;
  applyTheme(selected);
  try {
    localStorage.setItem("slothbank-theme", selected);
  } catch {}
});

loadThemePreference();

let lastGen = null;
async function load() {
  const r = await fetch("/api/digest");
  if (r.status === 404) { $("meta").textContent = "No digest yet."; $("msg").textContent = "Drop bills in data/inbox, or press ”œWake the sloth”."; return; }
  const d = await r.json();
  if (d.generated_at === lastGen) return;
  lastGen = d.generated_at; $("msg").textContent = "";
  render(d);
}

$("run").onclick = async () => {
  const btn = $("run");
  btn.disabled = true; $("msg").className = "sub"; $("msg").textContent = "Thinking… slowly.";
  try {
    const r = await fetch("/api/run", { method: "POST" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    $("msg").textContent = ""; lastGen = j.generated_at; render(j);
  } catch (e) { $("msg").className = "err"; $("msg").textContent = "Audit failed: " + e.message; }
  btn.disabled = false;
};
load();
setInterval(() => load().catch(() => {}), 4000); // pick up digests created by the watcher or the weekly cron
</script>
</body>
